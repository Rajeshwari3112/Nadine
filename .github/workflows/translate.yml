name: Translate GitBook to French

on:
  push:
    branches:
      - nadine  # Trigger the workflow on every push to the main branch
  workflow_dispatch: # Allow manual triggering

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests jq

    - name: Translate Markdown files to French
      run: |
        mkdir -p translations
        for file in docs/*.md; do
          filename=$(basename "$file")
          content=$(cat "$file")

          if [[ -z "$content" ]]; then
            echo "Warning: $file is empty. Skipping."
            continue
          fi

          # Microsoft Translator API call
          response=$(curl -s -X POST "https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=fr" \
              -H "Ocp-Apim-Subscription-Key: '${{ secrets.TRANSLATOR_API_KEY }}'" \
              -H "Ocp-Apim-Subscription-Region: '${{ secrets.AZURE_REGION }}'" \
              -H "Content-Type: application/json" \
              -d "[{\"Text\": \"$content\"}]")

          echo "API Response: $response"

          if echo "$response" | jq -e 'has("error")' > /dev/null; then
            echo "Error: API returned an error for $filename"
            echo "$response" | jq '.error'
            exit 1
          fi

          translated=$(echo "$response" | jq -r '.[0].translations[0].text')
          echo "$translated" > "translations/$filename"
          echo "Translated $filename"
        done

    - name: Commit and Push Translations
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Add and commit the translated files
        git add translations/
        git commit -m "Add French translations"
        git push
