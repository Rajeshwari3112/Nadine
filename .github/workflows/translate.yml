name: Translate GitBook to French

on:
  push:
    branches:
      - nadine  # Trigger on push to main branch
  workflow_dispatch: # Allow manual trigger

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests jq

    - name: Translate Markdown files to French
      run: |
        mkdir -p translations
        for file in docs/*.md; do
          filename=$(basename "$file")

          # Escape the Markdown content for JSON compatibility
          content=$(jq -Rs . < "$file")

          echo "Translating $filename..."

          # Microsoft Translator API call
          response=$(curl -s -X POST "https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=fr" \
              -H "Ocp-Apim-Subscription-Key: ${{ secrets.TRANSLATOR_API_KEY }}" \
              -H "Ocp-Apim-Subscription-Region: ${{ secrets.AZURE_REGION }}" \
              -H "Content-Type: application/json" \
              -d "[{\"Text\": $content}]")

          # Check for errors
          if echo "$response" | jq -e '.error' > /dev/null; then
            echo "Error: API returned an error for $filename"
            echo "$response"
            exit 1
          fi

          # Extract translated text
          translated=$(echo "$response" | jq -r '.[0].translations[0].text')

          # Save the translated content
          echo "$translated" > "translations/$filename"
          echo "Translated $filename successfully"
        done

    - name: Commit and Push Translations
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Use GITHUB_TOKEN for authentication
        git add translations/
        git commit -m "Add French translations"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
