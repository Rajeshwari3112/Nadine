name: Auto-Translate GitBook to French

on:
  push:
    branches:
      - nadine  # Trigger on push to the main branch
    paths:
      - 'docs/*.md'  # Trigger only on Markdown file changes
  workflow_dispatch:  # Allow manual trigger

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests jq

    - name: Translate Markdown files to French
      run: |
        mkdir -p translations
        changed=false  # Flag to track if changes occurred

        for file in docs/*.md; do
          filename=$(basename "$file")

          # Escape the Markdown content for JSON compatibility
          content=$(jq -Rs . < "$file")

          echo "Translating $filename..."

          # Microsoft Translator API call
          response=$(curl -s -X POST "https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=fr" \
              -H "Ocp-Apim-Subscription-Key: ${{ secrets.TRANSLATOR_API_KEY }}" \
              -H "Ocp-Apim-Subscription-Region: ${{ secrets.AZURE_REGION }}" \
              -H "Content-Type: application/json" \
              -d "[{\"Text\": $content}]")

          # Check for errors
          if echo "$response" | jq -e '.error' > /dev/null; then
            echo "Error: API returned an error for $filename"
            echo "$response"
            exit 1
          fi

          # Extract translated text
          translated=$(echo "$response" | jq -r '.[0].translations[0].text')

          # Save the translated content
          translated_file="translations/$filename"

          # Check if the content has changed
          if [ -f "$translated_file" ] && cmp -s <(echo "$translated") "$translated_file"; then
            echo "No changes detected for $filename, skipping commit."
          else
            echo "$translated" > "$translated_file"
            echo "Translated $filename successfully"
            changed=true  # Mark as changed
          fi
        done

    - name: Commit and Push Translations
      if: ${{ success() }}  # Only commit if the previous step succeeds
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Use GITHUB_TOKEN for authentication
        if [ "$changed" = true ]; then
          git add translations/
          git commit -m "Auto-update French translations"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:nadine
        else
          echo "No changes to commit."

